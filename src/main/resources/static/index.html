<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk Ticketing System</title>
    <!-- Modern Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #020408 100%);
            --card-bg: rgba(22, 28, 45, 0.6);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-border: rgba(99, 102, 241, 0.3);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --primary-hover: #4f46e5;
            
            --secondary: #14b8a6;
            --secondary-glow: rgba(20, 184, 166, 0.4);
            
            --success: #10b981;
            --warning: #f59e0b;
            --info: #06b6d4;
            --danger: #ef4444;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.25);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Ambient Glow Blobs */
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .blob-1 {
            top: -10%;
            left: 10%;
            width: 500px;
            height: 500px;
            background: var(--primary);
            animation: float 20s infinite alternate;
        }

        .blob-2 {
            bottom: -10%;
            right: 10%;
            width: 600px;
            height: 600px;
            background: var(--secondary);
            animation: float 25s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Glassmorphic Auth Panel */
        #auth-screen {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        #auth-screen.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            display: none;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2.auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.auth-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input, .input-wrapper textarea, .input-wrapper select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus, .input-wrapper textarea:focus, .input-wrapper select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
            background: rgba(10, 15, 30, 0.95);
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            box-shadow: none;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
            box-shadow: none;
        }

        /* Dashboard Screen */
        #dashboard-screen {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 1250px;
            margin: 40px auto;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            display: none;
        }

        #dashboard-screen.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            display: block;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 28px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
        }

        .user-info {
            text-align: left;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .user-role {
            font-size: 12px;
            color: var(--text-muted);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
        }

        .stat-card.total::after { background: var(--info); }
        .stat-card.open::after { background: var(--warning); }
        .stat-card.assigned::after { background: var(--primary); }
        .stat-card.resolved::after { background: var(--success); }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-val {
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
            margin-top: 8px;
        }

        /* Main Workspace Grid */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            margin-bottom: 24px;
        }

        .panel-card:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.05);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .panel-title svg {
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }

        /* Ticket List styles */
        .search-bar {
            margin-bottom: 20px;
        }

        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .ticket-card {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            position: relative;
        }

        .ticket-card:hover {
            background: rgba(22, 28, 45, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .ticket-card.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .ticket-id {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .ticket-status {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-open {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .status-assigned {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        .status-resolved {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .ticket-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .ticket-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ticket-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-dark);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 8px;
        }

        /* Detail Actions Panel */
        .actions-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: var(--text-dark);
            text-align: center;
        }

        .actions-placeholder svg {
            width: 48px;
            height: 48px;
            fill: var(--text-dark);
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .selected-details {
            display: none;
        }

        .selected-details.active {
            display: block;
        }

        .detail-item {
            margin-bottom: 16px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .detail-val {
            font-size: 15px;
            font-weight: 500;
        }

        .ticket-action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .toast {
            background: rgba(15, 23, 42, 0.9);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-size: 14px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            transform: translateY(100px);
            opacity: 0;
            animation: toastIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes toastIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.info { border-color: var(--info); }
    </style>
</head>
<body>

    <!-- Ambient glows -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm0 8H7v-2h10v2z"/>
                </svg>
            </div>
            <span class="logo-text">FlowDesk</span>
        </div>
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-desc">Log in to manage support tickets</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="login-email" value="admin@gmail.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" value="password123" required>
                </div>
            </div>
            <button type="submit" class="btn" id="login-btn" style="margin-top: 10px;">
                Authenticate
            </button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen">
        <header>
            <div class="logo-container" style="margin-bottom: 0;">
                <div class="logo-icon" style="width: 36px; height: 36px; border-radius: 8px;">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm0 8H7v-2h10v2z"/>
                    </svg>
                </div>
                <span class="logo-text" style="font-size: 20px;">FlowDesk</span>
            </div>
            <div class="user-panel">
                <div class="avatar" id="user-avatar">A</div>
                <div class="user-info">
                    <div class="user-name" id="profile-name">Administrator</div>
                    <div class="user-role" id="profile-email">admin@gmail.com</div>
                </div>
                <button class="logout-btn" id="logout-btn">Log out</button>
            </div>
        </header>

        <!-- Stats Counter -->
        <div class="stats-grid">
            <div class="stat-card total">
                <span class="stat-label">Total Tickets</span>
                <span class="stat-val" id="stat-total">0</span>
            </div>
            <div class="stat-card open">
                <span class="stat-label">Open</span>
                <span class="stat-val" id="stat-open">0</span>
            </div>
            <div class="stat-card assigned">
                <span class="stat-label">Assigned</span>
                <span class="stat-val" id="stat-assigned">0</span>
            </div>
            <div class="stat-card resolved">
                <span class="stat-label">Resolved</span>
                <span class="stat-val" id="stat-resolved">0</span>
            </div>
        </div>

        <!-- Workspace Layout -->
        <div class="workspace-grid">
            
            <!-- Left Column: Forms -->
            <div class="forms-column">
                
                <!-- Submit Ticket Panel -->
                <div class="panel-card">
                    <h3 class="panel-title">
                        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        Submit Ticket
                    </h3>
                    <form id="ticket-form">
                        <div class="form-group">
                            <label for="ticket-title">Title</label>
                            <div class="input-wrapper">
                                <input type="text" id="ticket-title" placeholder="Brief issue description" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ticket-desc">Description</label>
                            <div class="input-wrapper">
                                <textarea id="ticket-desc" rows="3" placeholder="Describe the problem in detail..." required></textarea>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ticket-email">User Email</label>
                            <div class="input-wrapper">
                                <input type="email" id="ticket-email" placeholder="customer@domain.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn" id="submit-ticket-btn" style="margin-top: 10px;">
                            Create Support Ticket
                        </button>
                    </form>
                </div>

                <!-- Ticket Operations Panel -->
                <div class="panel-card" id="operations-panel">
                    <h3 class="panel-title">
                        <svg viewBox="0 0 24 24"><path d="M12.89 3L14.85 4.96L11.11 8.7L12.53 10.12L16.27 6.38L18.23 8.34L19.23 3.34L14.23 4.34L12.89 3ZM11.11 15.3L7.37 19.04L5.41 17.08L4.41 22.08L9.41 21.08L8.07 19.74L11.81 16L10.39 14.58L11.11 15.3ZM12 8C9.79 8 8 9.79 8 12C8 14.21 9.79 16 12 16C14.21 16 16 14.21 16 12C16 9.79 14.21 8 12 8Z"/></svg>
                        Manage Selected
                    </h3>
                    
                    <div class="actions-placeholder" id="details-placeholder">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                        <p>Select a ticket from the list to update status or assign technician.</p>
                    </div>

                    <div class="selected-details" id="details-view">
                        <div class="detail-item">
                            <div class="detail-label">Current Ticket ID</div>
                            <div class="detail-val" id="detail-id">#0</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Title</div>
                            <div class="detail-val" id="detail-title" style="font-weight: 600;">-</div>
                        </div>

                        <!-- Assign Tech Form -->
                        <div class="form-group" style="margin-top: 20px;">
                            <label for="assign-tech">Assign Technician</label>
                            <div style="display: flex; gap: 8px;">
                                <div class="input-wrapper" style="flex: 1;">
                                    <select id="assign-tech">
                                        <option value="John Doe">John Doe</option>
                                        <option value="Sarah Jenkins">Sarah Jenkins</option>
                                        <option value="Marcus Aurelius">Marcus Aurelius</option>
                                        <option value="Emily Wong">Emily Wong</option>
                                    </select>
                                </div>
                                <button type="button" class="btn" id="assign-btn" style="width: auto; padding: 0 16px;">
                                    Assign
                                </button>
                            </div>
                        </div>

                        <!-- Update Status Form -->
                        <div class="form-group" style="margin-top: 16px;">
                            <label for="update-status">Update Status</label>
                            <div style="display: flex; gap: 8px;">
                                <div class="input-wrapper" style="flex: 1;">
                                    <select id="update-status">
                                        <option value="OPEN">Open</option>
                                        <option value="IN_PROGRESS">In Progress</option>
                                        <option value="RESOLVED">Resolved</option>
                                    </select>
                                </div>
                                <button type="button" class="btn btn-secondary" id="update-status-btn" style="width: auto; padding: 0 16px;">
                                    Update
                                </button>
                            </div>
                        </div>

                        <div class="ticket-action-btns">
                            <button class="btn btn-secondary" id="deselect-btn">Deselect</button>
                            <button class="btn" id="resolve-quick-btn" style="background: linear-gradient(135deg, var(--success) 0%, #059669 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);">
                                Resolve Ticket
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Ticket Grid -->
            <div class="list-column">
                <div class="panel-card" style="margin-bottom: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 class="panel-title" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
                            <svg viewBox="0 0 24 24"><path d="M4 14h6v-10h-6v10zm0 6h6v-4h-6v4zm8-16v6h6v-6h-6zm0 16h6v-8h-6v8z"/></svg>
                            Active Tickets
                        </h3>
                        <button class="btn btn-secondary" id="refresh-btn" style="width: auto; padding: 8px 16px; font-size: 13px;">
                            Refresh List
                        </button>
                    </div>

                    <div class="search-bar">
                        <div class="input-wrapper">
                            <input type="text" id="search-input" placeholder="Search by title, description or email...">
                        </div>
                    </div>

                    <div class="ticket-list" id="ticket-list-container">
                        <!-- Tickets populated dynamically -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Notifications container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // State
        let ticketsList = [];
        let selectedTicketId = null;

        // Dom Elements
        const authScreen = document.getElementById('auth-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const logoutBtn = document.getElementById('logout-btn');
        
        const ticketForm = document.getElementById('ticket-form');
        const ticketTitle = document.getElementById('ticket-title');
        const ticketDesc = document.getElementById('ticket-desc');
        const ticketEmail = document.getElementById('ticket-email');
        
        const ticketListContainer = document.getElementById('ticket-list-container');
        const searchInput = document.getElementById('search-input');
        const refreshBtn = document.getElementById('refresh-btn');

        const detailsPlaceholder = document.getElementById('details-placeholder');
        const detailsView = document.getElementById('details-view');
        const detailId = document.getElementById('detail-id');
        const detailTitle = document.getElementById('detail-title');
        const assignTech = document.getElementById('assign-tech');
        const assignBtn = document.getElementById('assign-btn');
        const updateStatusSelect = document.getElementById('update-status');
        const updateStatusBtn = document.getElementById('update-status-btn');
        const resolveQuickBtn = document.getElementById('resolve-quick-btn');
        const deselectBtn = document.getElementById('deselect-btn');

        // Stat elements
        const statTotal = document.getElementById('stat-total');
        const statOpen = document.getElementById('stat-open');
        const statAssigned = document.getElementById('stat-assigned');
        const statResolved = document.getElementById('stat-resolved');

        // Toast Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div style="flex: 1;">${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Login Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmail.value;
            const password = loginPassword.value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const text = await response.text();
                    showToast(text, 'success');
                    
                    // Transition to Dashboard
                    authScreen.classList.add('hidden');
                    
                    // Wait a bit for auth transition
                    setTimeout(() => {
                        dashboardScreen.classList.add('visible');
                        document.body.style.alignItems = 'flex-start';
                        document.getElementById('profile-email').innerText = email;
                        document.getElementById('profile-name').innerText = email.split('@')[0].toUpperCase();
                        document.getElementById('user-avatar').innerText = email[0].toUpperCase();
                        loadTickets();
                    }, 200);
                } else {
                    const err = await response.text();
                    showToast(err || 'Invalid login details.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Unable to connect to server authentication endpoint.', 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            dashboardScreen.classList.remove('visible');
            document.body.style.alignItems = 'center';
            setTimeout(() => {
                authScreen.classList.remove('hidden');
                selectedTicketId = null;
                ticketsList = [];
                updateDetailsView();
            }, 200);
            showToast('Logged out successfully', 'info');
        });

        // Load Tickets
        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets/');
                if (response.ok) {
                    ticketsList = await response.json();
                    renderTickets();
                    updateStats();
                } else {
                    showToast('Failed to fetch tickets list', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Failed to connect to get tickets endpoint', 'error');
            }
        }

        // Update Stats
        function updateStats() {
            statTotal.innerText = ticketsList.length;
            statOpen.innerText = ticketsList.filter(t => t.status === 'OPEN').length;
            statAssigned.innerText = ticketsList.filter(t => t.status.startsWith('ASSIGNED_TO_')).length;
            statResolved.innerText = ticketsList.filter(t => t.status === 'RESOLVED').length;
        }

        // Render Tickets
        function renderTickets() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = ticketsList.filter(t => 
                t.title.toLowerCase().includes(query) ||
                t.description.toLowerCase().includes(query) ||
                t.userEmail.toLowerCase().includes(query) ||
                t.status.toLowerCase().includes(query)
            );

            ticketListContainer.innerHTML = '';
            if (filtered.length === 0) {
                ticketListContainer.innerHTML = `
                    <div style="text-align: center; color: var(--text-dark); padding: 40px 0;">
                        No tickets found matching details.
                    </div>
                `;
                return;
            }

            // Sort so newest or selected is visible
            filtered.forEach(ticket => {
                const isSelected = selectedTicketId === ticket.id;
                const card = document.createElement('div');
                card.className = `ticket-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => selectTicket(ticket.id);

                let badgeClass = 'status-open';
                let displayStatus = ticket.status;
                if (ticket.status === 'RESOLVED') {
                    badgeClass = 'status-resolved';
                } else if (ticket.status.startsWith('ASSIGNED_TO_')) {
                    badgeClass = 'status-assigned';
                    displayStatus = ticket.status.replace('ASSIGNED_TO_', 'ASSIGNED: ');
                }

                card.innerHTML = `
                    <div class="ticket-header">
                        <span class="ticket-id">ID: #${ticket.id}</span>
                        <span class="ticket-status ${badgeClass}">${displayStatus}</span>
                    </div>
                    <div class="ticket-title">${escapeHtml(ticket.title)}</div>
                    <div class="ticket-desc">${escapeHtml(ticket.description)}</div>
                    <div class="ticket-meta">
                        <span>${escapeHtml(ticket.userEmail)}</span>
                    </div>
                `;
                ticketListContainer.appendChild(card);
            });
        }

        // Helper escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Select Ticket
        function selectTicket(id) {
            selectedTicketId = id;
            renderTickets();
            updateDetailsView();
        }

        // Update Details View
        function updateDetailsView() {
            if (!selectedTicketId) {
                detailsPlaceholder.style.display = 'flex';
                detailsView.classList.remove('active');
                return;
            }

            const ticket = ticketsList.find(t => t.id === selectedTicketId);
            if (!ticket) {
                selectedTicketId = null;
                updateDetailsView();
                return;
            }

            detailsPlaceholder.style.display = 'none';
            detailsView.classList.add('active');
            
            detailId.innerText = `ID: #${ticket.id}`;
            detailTitle.innerText = ticket.title;

            // Pre-select status
            if (ticket.status === 'OPEN' || ticket.status === 'RESOLVED' || ticket.status === 'IN_PROGRESS') {
                updateStatusSelect.value = ticket.status;
            } else if (ticket.status.startsWith('ASSIGNED_TO_')) {
                updateStatusSelect.value = 'IN_PROGRESS';
            }
        }

        // Submit Ticket Form
        ticketForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = ticketTitle.value;
            const description = ticketDesc.value;
            const userEmail = ticketEmail.value;

            try {
                const response = await fetch('/api/tickets/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, userEmail })
                });

                if (response.ok) {
                    showToast('Ticket Submitted Successfully!', 'success');
                    ticketForm.reset();
                    loadTickets();
                } else {
                    const err = await response.text();
                    showToast(err || 'Failed to submit ticket.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to ticket submission API.', 'error');
            }
        });

        // Assign Technician
        assignBtn.addEventListener('click', async () => {
            if (!selectedTicketId) return;
            const techName = assignTech.value;

            try {
                const response = await fetch(`/api/technician/assign/${selectedTicketId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ technicianName: techName })
                });

                if (response.ok) {
                    showToast(`Assigned successfully to ${techName}`, 'success');
                    loadTickets().then(() => updateDetailsView());
                } else {
                    const err = await response.text();
                    showToast(err || 'Failed to assign technician.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to technician assignment API.', 'error');
            }
        });

        // Update Status
        updateStatusBtn.addEventListener('click', async () => {
            if (!selectedTicketId) return;
            const newStatus = updateStatusSelect.value;

            try {
                const response = await fetch(`/api/tickets/${selectedTicketId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    showToast(`Status updated to ${newStatus}`, 'success');
                    loadTickets().then(() => updateDetailsView());
                } else {
                    const err = await response.text();
                    showToast(err || 'Failed to update ticket status.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to ticket status API.', 'error');
            }
        });

        // Resolve Quick Button
        resolveQuickBtn.addEventListener('click', async () => {
            if (!selectedTicketId) return;

            try {
                const response = await fetch(`/api/tickets/${selectedTicketId}/resolve`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    showToast('Ticket Resolved Successfully & User Notified!', 'success');
                    loadTickets().then(() => updateDetailsView());
                } else {
                    const err = await response.text();
                    showToast(err || 'Failed to resolve ticket.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to ticket resolution API.', 'error');
            }
        });

        // Deselect Button
        deselectBtn.addEventListener('click', () => {
            selectedTicketId = null;
            renderTickets();
            updateDetailsView();
        });

        // Refresh List
        refreshBtn.addEventListener('click', () => {
            loadTickets();
            showToast('Tickets list refreshed', 'info');
        });

        // Search Input listener
        searchInput.addEventListener('input', renderTickets);
    </script>
</body>
</html>
